name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  decide:
    runs-on: ubuntu-latest
    outputs:
      will_release: ${{ steps.dryrun.outputs.will_release }}
      next_version: ${{ steps.dryrun.outputs.next_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Cocogitto
        uses: cocogitto/cocogitto-action@v3

      - name: Compute next version
        id: dryrun
        shell: bash
        run: |
          set -euo pipefail
          # cog bump --auto --dry-run prints the next *tag* (with the configured
          # tag_prefix, e.g. "v0.1.0") on stdout, or exits non-zero if there are
          # no releasable commits since the latest tag. Strip the leading "v"
          # so downstream steps work with bare semver "0.1.0".
          if RAW="$(cog bump --auto --dry-run 2>/dev/null)"; then
            NEXT="${RAW#v}"
            echo "will_release=true" >> "$GITHUB_OUTPUT"
            echo "next_version=$NEXT" >> "$GITHUB_OUTPUT"
            echo "Next version: $NEXT (tag will be v$NEXT)"
          else
            echo "will_release=false" >> "$GITHUB_OUTPUT"
            echo "No releasable commits since last tag"
          fi

  release:
    needs: decide
    if: needs.decide.outputs.will_release == 'true'
    runs-on: macos-14
    env:
      NEXT_VERSION: ${{ needs.decide.outputs.next_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Install Cocogitto
        run: brew install cocogitto

      - name: Configure git for cog bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Import Developer ID certificate
        env:
          CERTIFICATE_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          CERTIFICATE_PATH: ${{ runner.temp }}/certificate.p12
          KEYCHAIN_PATH: ${{ runner.temp }}/build.keychain
          KEYCHAIN_PASSWORD_FILE: ${{ runner.temp }}/keychain-password
        run: |
          set -euo pipefail
          echo "$(uuidgen)" > "$KEYCHAIN_PASSWORD_FILE"
          security create-keychain -p "$(cat "$KEYCHAIN_PASSWORD_FILE")" "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          security unlock-keychain -p "$(cat "$KEYCHAIN_PASSWORD_FILE")" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          echo "$CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          security import "$CERTIFICATE_PATH" -k "$KEYCHAIN_PATH" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$(cat "$KEYCHAIN_PASSWORD_FILE")" "$KEYCHAIN_PATH"
          CODE_SIGN_IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | awk -F'"' '/Developer ID Application/ {print $2; exit}')"
          if [ -z "$CODE_SIGN_IDENTITY" ]; then
            echo "No Developer ID Application signing identity found in temporary keychain" >&2
            exit 1
          fi
          echo "CODE_SIGN_IDENTITY=$CODE_SIGN_IDENTITY" >> "$GITHUB_ENV"

      - name: Configure notarytool profile
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_NOTARYTOOL_PROFILE: ${{ secrets.APPLE_NOTARYTOOL_PROFILE }}
        run: |
          set -euo pipefail
          xcrun notarytool store-credentials "$APPLE_NOTARYTOOL_PROFILE" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD"

      - name: Bump version (commits CHANGELOG + plists, creates tag)
        run: |
          set -euo pipefail
          # cog runs the pre_bump_hooks defined in cog.toml — these update both
          # Info.plists via PlistBuddy. Then cog writes CHANGELOG.md, commits
          # everything, and creates the v${NEXT_VERSION} tag.
          cog bump --version "${NEXT_VERSION}"
          echo "Bumped to ${NEXT_VERSION}; tag v${NEXT_VERSION} created locally"

      - name: Build signed app
        run: |
          set -euo pipefail
          make release-zip CONFIGURATION=release CODE_SIGN_IDENTITY="$CODE_SIGN_IDENTITY"
          codesign --verify --deep --strict --verbose=2 build/Adrenaline.app

      - name: Notarize app zip
        env:
          APPLE_NOTARYTOOL_PROFILE: ${{ secrets.APPLE_NOTARYTOOL_PROFILE }}
        run: |
          set -euo pipefail
          xcrun notarytool submit build/Adrenaline.zip --keychain-profile "$APPLE_NOTARYTOOL_PROFILE" --wait
          xcrun stapler staple build/Adrenaline.app
          xcrun stapler validate build/Adrenaline.app
          spctl --assess --type execute --verbose=4 build/Adrenaline.app
          rm -f build/Adrenaline.zip
          ditto -c -k --keepParent build/Adrenaline.app "build/Adrenaline-v${NEXT_VERSION}.zip"

      - name: Sign update with EdDSA
        shell: bash
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          SPARKLE_VERSION=$(python3 - <<'PY'
          import json
          with open('Package.resolved') as f:
              data = json.load(f)
          for pin in data['pins']:
              if pin['identity'] == 'sparkle':
                  print(pin['state']['version'])
                  break
          else:
              raise SystemExit('Sparkle pin not found in Package.resolved')
          PY
          )
          curl -fsSL "https://github.com/sparkle-project/Sparkle/releases/download/${SPARKLE_VERSION}/Sparkle-${SPARKLE_VERSION}.tar.xz" \
            | tar -xJf - -C "$RUNNER_TEMP" "./bin/sign_update"
          SIGN_UPDATE="$RUNNER_TEMP/bin/sign_update"
          SIG_AND_LEN=$("$SIGN_UPDATE" --ed-key-file <(printf "%s" "$SPARKLE_ED_PRIVATE_KEY") "build/Adrenaline-v${NEXT_VERSION}.zip")
          echo "SPARKLE_SIG_AND_LEN=$SIG_AND_LEN" >> "$GITHUB_ENV"

      - name: Update cask formula
        env:
          VERSION: ${{ env.NEXT_VERSION }}
        run: |
          set -euo pipefail
          SHA=$(shasum -a 256 "build/Adrenaline-v${VERSION}.zip" | awk '{print $1}')
          /usr/bin/sed -i '' \
            -e 's|^  version ".*"$|  version "'"${VERSION}"'"|' \
            -e 's|^  sha256 ".*"$|  sha256 "'"${SHA}"'"|' \
            Casks/adrenaline.rb
          git add Casks/adrenaline.rb
          git commit --amend --no-edit
          git tag -f "v${VERSION}" HEAD
          echo "Cask formula updated to ${VERSION} (sha256 ${SHA})"

      - name: Push commit and tag
        run: |
          set -euo pipefail
          git push --force-with-lease origin HEAD
          git push --force origin "v${NEXT_VERSION}"

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          # Generate per-release notes from cog (covers commits in this version only).
          cog changelog --at "v${NEXT_VERSION}" > release-notes.md
          gh release create "v${NEXT_VERSION}" \
            --title "v${NEXT_VERSION}" \
            --notes-file release-notes.md \
            "build/Adrenaline-v${NEXT_VERSION}.zip"

      - name: Publish appcast entry
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ env.NEXT_VERSION }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          DOWNLOAD_URL="https://github.com/${GH_REPO}/releases/download/v${VERSION}/Adrenaline-v${VERSION}.zip"
          PUB_DATE=$(date -u +"%a, %d %b %Y %H:%M:%S +0000")

          git clone --depth 1 --branch gh-pages \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GH_REPO}.git" gh-pages
          cd gh-pages

          if grep -q "<title>Adrenaline ${VERSION}</title>" appcast.xml; then
            echo "Appcast already contains v${VERSION}, skipping"
            exit 0
          fi

          # Write per-version HTML + cumulative latest.html + update appcast.
          # All HTML generation is in Python to avoid shell escaping issues.
          export VERSION DOWNLOAD_URL PUB_DATE SPARKLE_SIG_AND_LEN GH_REPO
          python3 - <<'PY'
          import json, os, pathlib, subprocess, sys

          version = os.environ['VERSION']
          gh_repo = os.environ['GH_REPO']
          release_notes_url = f"https://{gh_repo.split('/')[0]}.github.io/{gh_repo.split('/')[1]}/releases/latest.html"

          CSS = """body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            padding: 1em;
            color-scheme: light dark;
            color: -apple-system-label;
            background: transparent;
          }
          a { color: #0066cc; }
          @media (prefers-color-scheme: dark) {
            a { color: #5ac8fa; }
          }
          h2 { font-size: 1.3em; margin-top: 1.2em; }
          h4 { font-size: 1em; margin-bottom: 0.3em; }
          ul { padding-left: 1.5em; }
          li { margin-bottom: 0.3em; }
          /* Sparkle injects 'sparkle-installed-version' class on the <section>
             whose data-sparkle-version matches the installed app version.
             Hide that section and all subsequent (older) sibling sections. */
          .sparkle-installed-version,
          .sparkle-installed-version ~ section { display: none; }
          section + section { border-top: 1px solid rgba(128,128,128,0.3);
                              padding-top: 1.5em; margin-top: 1.5em; }
          section:first-child h2:first-child { margin-top: 0; }"""

          def html_page(title, body):
              return f"""<!DOCTYPE html>
          <html lang="en">
          <head>
          <meta charset="utf-8">
          <title>{title}</title>
          <style>
          {CSS}
          </style>
          </head>
          <body>
          {body}
          </body>
          </html>"""

          def fetch_body_html(tag):
              r = subprocess.run(
                  ["gh", "api", "-H", "Accept: application/vnd.github.full+json",
                   f"repos/{gh_repo}/releases/tags/{tag}", "--jq", ".body_html"],
                  capture_output=True, text=True)
              return r.stdout.strip() if r.returncode == 0 else None

          releases = pathlib.Path('releases')
          releases.mkdir(exist_ok=True)

          # Write per-version HTML file.
          body = fetch_body_html(f'v{version}')
          if not body:
              sys.exit(f'Failed to fetch release notes for v{version}')
          (releases / f'{version}.html').write_text(html_page(f'Adrenaline {version}', body))

          # Regenerate cumulative latest.html from all GitHub releases (newest first).
          # Each version is wrapped in <section data-sparkle-version="X.Y.Z"> so
          # Sparkle's built-in JS can mark the installed version's section, and
          # our CSS hides it plus all older sections.
          r = subprocess.run(
              ["gh", "api", f"repos/{gh_repo}/releases", "--paginate",
               "--jq", ".[].tag_name"],
              capture_output=True, text=True)
          tags = [t.strip() for t in r.stdout.strip().split('\n') if t.strip()]
          sections = []
          for tag in tags:
              b = fetch_body_html(tag)
              if b:
                  ver = tag.lstrip('v')
                  sections.append(f'<section data-sparkle-version="{ver}">\n{b}\n</section>')
          (releases / 'latest.html').write_text(
              html_page('Adrenaline Release Notes', '\n'.join(sections)))

          # Inject appcast <item> before </channel>.
          # Uses <sparkle:releaseNotesLink> pointing to latest.html so Sparkle
          # renders it in WKWebView with the version-aware CSS/JS trimming.
          item = f"""        <item>
              <title>Adrenaline {version}</title>
              <pubDate>{os.environ['PUB_DATE']}</pubDate>
              <sparkle:version>{version}</sparkle:version>
              <sparkle:shortVersionString>{version}</sparkle:shortVersionString>
              <sparkle:minimumSystemVersion>10.13</sparkle:minimumSystemVersion>
              <sparkle:releaseNotesLink>{release_notes_url}</sparkle:releaseNotesLink>
              <sparkle:fullReleaseNotesLink>https://github.com/{gh_repo}/releases</sparkle:fullReleaseNotesLink>
              <enclosure url="{os.environ['DOWNLOAD_URL']}"
                         type="application/octet-stream"
                         {os.environ['SPARKLE_SIG_AND_LEN']} />
          </item>"""
          appcast = pathlib.Path('appcast.xml')
          content = appcast.read_text()
          if '</channel>' not in content:
              sys.exit('appcast.xml has no </channel> close tag')
          appcast.write_text(content.replace('</channel>', item + '\n    </channel>', 1))
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add appcast.xml releases/
          git commit -m "appcast: v${VERSION}"
          git push origin gh-pages

      - name: Cleanup signing materials
        if: always()
        env:
          CERTIFICATE_PATH: ${{ runner.temp }}/certificate.p12
          KEYCHAIN_PATH: ${{ runner.temp }}/build.keychain
        run: |
          set -euo pipefail
          rm -f "$CERTIFICATE_PATH"
          security default-keychain -s login.keychain-db || true
          security delete-keychain "$KEYCHAIN_PATH" || true
